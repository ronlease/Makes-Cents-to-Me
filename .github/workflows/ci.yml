name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ── .NET: restore, build, test, and coverage enforcement ──────────────────
  dotnet-build-test:
    name: .NET Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-

      - name: Restore dependencies
        run: dotnet restore MakesCentsToMe.slnx

      - name: Build
        run: dotnet build MakesCentsToMe.slnx --no-restore --configuration Release

      - name: Verify empty test project guard
        run: |
          set -uo pipefail
          probe=tests/EmptyProjectGuardProbe
          mkdir -p "$probe"
          cat > "$probe/EmptyProjectGuardProbe.csproj" <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>net10.0</TargetFramework>
              <IsPackable>false</IsPackable>
              <IsTestProject>true</IsTestProject>
            </PropertyGroup>
            <ItemGroup>
              <PackageReference Include="Microsoft.NET.Test.Sdk" Version="17.*" />
              <PackageReference Include="xunit" Version="2.*" />
            </ItemGroup>
          </Project>
          EOF
          output=$(dotnet build "$probe/EmptyProjectGuardProbe.csproj" --configuration Release 2>&1)
          status=$?
          echo "$output"
          rm -rf "$probe"
          if [ "$status" -eq 0 ]; then
            echo "::error::Empty test project guard did not fail the build"
            exit 1
          fi
          if ! echo "$output" | grep -q "contains no test source files"; then
            echo "::error::Probe build failed, but not with the empty test project guard message"
            exit 1
          fi
          echo "Empty test project guard works as expected."

      - name: Run tests
        run: |
          set -euo pipefail
          mkdir -p ./test-results
          for project in tests/*/*.csproj; do
            name=$(basename "$project" .csproj)
            echo "::group::Testing ${name}"
            dotnet test "$project" \
              --no-build --configuration Release --verbosity normal \
              --logger "trx;LogFileName=${name}.trx" \
              --results-directory ./test-results \
              --collect:"XPlat Code Coverage" \
              --settings coverlet.runsettings 2>&1 | tee -a ./test-results/test-output.log
            echo "::endgroup::"
          done

      - name: Verify every test project discovered tests
        run: |
          set -euo pipefail
          failed=0
          for project in tests/*/*.csproj; do
            name=$(basename "$project" .csproj)
            trx="./test-results/${name}.trx"
            if [ ! -f "$trx" ]; then
              echo "::error::No TRX file produced for ${name}"
              failed=1
              continue
            fi
            total=$(grep -oP '<Counters total="\K\d+' "$trx" | head -n 1 || true)
            if [ -z "$total" ] || [ "$total" -eq 0 ]; then
              echo "::error::${name} discovered no tests"
              failed=1
              continue
            fi
            echo "${name}: ${total} tests discovered"
          done
          if grep -q "No test is available" ./test-results/test-output.log; then
            echo "::error::'No test is available' reported by dotnet test"
            failed=1
          fi
          exit $failed

      - name: Install ReportGenerator
        run: dotnet tool install -g dotnet-reportgenerator-globaltool

      - name: Generate coverage report and enforce 90% threshold
        run: |
          reportgenerator \
            -reports:"**/coverage.cobertura.xml" \
            -targetdir:./coverage-report \
            -reporttypes:"TextSummary;Html"
          cat ./coverage-report/Summary.txt

          line_coverage=$(grep "Line coverage:" ./coverage-report/Summary.txt | grep -oP '\d+\.?\d*(?=%)')
          echo "Line coverage: ${line_coverage}%"

          if (( $(echo "$line_coverage < 90" | bc -l) )); then
            echo "ERROR: Code coverage (${line_coverage}%) is below the required threshold of 90%"
            exit 1
          fi

          echo "SUCCESS: Code coverage (${line_coverage}%) meets the required threshold of 90%"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dotnet-test-results
          path: ./test-results/*.trx
          retention-days: 7

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dotnet-coverage-report
          path: ./coverage-report/
          retention-days: 7

  # ── .NET: format check ────────────────────────────────────────────────────
  dotnet-format:
    name: .NET Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-

      - name: Restore dependencies
        run: dotnet restore MakesCentsToMe.slnx

      - name: Check formatting
        run: dotnet format MakesCentsToMe.slnx --verify-no-changes --verbosity diagnostic

  # ── .NET: dependency vulnerability scan ───────────────────────────────────
  dotnet-dependency-scan:
    name: .NET Dependency Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-

      - name: Restore dependencies
        run: dotnet restore MakesCentsToMe.slnx

      - name: Scan for vulnerable packages
        run: |
          output=$(dotnet list MakesCentsToMe.slnx package --vulnerable --include-transitive 2>&1)
          echo "$output"
          if echo "$output" | grep -qi "has the following vulnerable packages"; then
            echo "Vulnerable packages detected. Failing the build."
            exit 1
          fi

  # ── Angular: production build ──────────────────────────────────────────────
  angular-build:
    name: Angular Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src/MakesCentsToMe.Web

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: src/MakesCentsToMe.Web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Create environment files
        run: |
          cp src/environments/environment.template.ts src/environments/environment.ts
          cp src/environments/environment.template.ts src/environments/environment.prod.ts

      - name: Build (production)
        run: npx ng build --configuration production

  # ── npm: audit for high/critical vulnerabilities ──────────────────────────
  npm-audit:
    name: npm Audit
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src/MakesCentsToMe.Web

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: src/MakesCentsToMe.Web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

  # ── Angular: lint ─────────────────────────────────────────────────────────
  angular-lint:
    name: Angular Lint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src/MakesCentsToMe.Web

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: src/MakesCentsToMe.Web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx ng lint

  # ── Angular: unit tests ────────────────────────────────────────────────────
  angular-test:
    name: Angular Unit Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src/MakesCentsToMe.Web

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: src/MakesCentsToMe.Web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Create environment files
        run: |
          cp src/environments/environment.template.ts src/environments/environment.ts
          cp src/environments/environment.template.ts src/environments/environment.prod.ts

      - name: Run unit tests
        run: npx ng test --watch=false

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: angular-coverage
          path: src/MakesCentsToMe.Web/coverage/
          retention-days: 7

  # ── Secret scanning via Gitleaks ──────────────────────────────────────────
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
